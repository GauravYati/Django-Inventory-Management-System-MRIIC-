{% extends "mriic/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Signup | MRIIC Inventory{% endblock %}

{% block content %}
  <div class="container">
    <div class="auth-panel">
      <div class="empty-state-icon"><i class="bi bi-person-plus"></i></div>
      <h1 class="section-title h2 mb-1">Create Account</h1>
      <p class="muted mb-4">Create a user account for MRIIC inventory access.</p>
      <form method="post">
        {% csrf_token %}
        {{ signup_form|crispy }}
        <button class="btn btn-primary w-100 mt-3" type="submit">Create Account</button>
      </form>
    </div>
  </div>
{% endblock %}
